[project]
name = "autoim"
version = "0.1.0"
description = "Windows GUI and UI Automation capability probe for enterprise IM clients"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.7,<7",
    "psutil>=6.0,<8",
    "pywinauto>=0.6.8,<1",
    "uiautomation>=2.0,<3",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
autoim = "autoim.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoim"]
